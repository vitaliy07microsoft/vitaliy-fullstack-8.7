<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>вёрстка 8 главы</title>
  </head>
  <body class="body">
    
    <section class="top">
      <div class="top--line"></div>

      <div class="top__text">РЕМОНТ ТЕХНИКИ РАЗЛИЧНЫХ БРЕНДОВ</div>
    </section>

    <section class="mid">
      <div class="swiper">

        <div class="swiper-wrapper">


            <div class="swiper-slide" id="swiper-slide-1">
              <img src="/images/Bitmap.png" alt="lenovo-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-2">
              <img src="/images/Bitmap (1).png" alt="samsung-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-3">
              <img src="/images/Bitmap (2).png" alt="apple-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-4">
              <img src="/images/Bitmap (3).png" alt="viewsonic-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-5">
              <img src="/images/Bitmap (4).png" alt="bosch-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-6">
              <img src="/images/Bitmap (5).png" alt="hp-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-7">
              <img src="/images/Bitmap (6).png" alt="acer-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-8">
              <img src="/images/Bitmap (7).png" alt="sony-img" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>
            <div class="swiper-slide" id="swiper-slide-9">
              <img src="/images/Bitmap.png" alt="lenovo-img2" class="swiper-slide-img">
              <img src="/images/go.png" alt="go-png" class="swiper-slide-go">
            </div>


        </div>

        <div class="swiper-pagination"></div>

      </div>
    </section>


    <section class="bottom">
      <button class="bottom__button" onclick="showMore()">
        <img src="/images/expand.png" alt="expand-img" class="bottom__button--img">
      <div class="bottom__button--text">Показать всё</div>
      </button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
